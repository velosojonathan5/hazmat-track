services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hazmat
      POSTGRES_PASSWORD: hazmat
      POSTGRES_DB: hazmat_track
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazmat"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hazmat
      MINIO_ROOT_PASSWORD: hazmat123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: hazmat
      DB_PASSWORD: hazmat
      DB_NAME: hazmat_track
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: local-dev-secret-change-me
      JWT_EXPIRES_IN: 1d
      STORAGE_INTERNAL_ENDPOINT: http://storage:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000/hazmat-track
      STORAGE_ACCESS_KEY: hazmat
      STORAGE_SECRET_KEY: hazmat123
      STORAGE_BUCKET: hazmat-track
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  db_data:
  storage_data:
